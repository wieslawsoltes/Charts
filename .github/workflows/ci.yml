name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ProCharts.slnx

      - name: Build
        run: dotnet build ProCharts.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test Avalonia
        run: dotnet test tests/ProCharts.Avalonia.Tests/ProCharts.Avalonia.Tests.csproj -c Release --no-build --logger "trx;LogFileName=procharts-avalonia-tests.trx" --results-directory artifacts/test-results

      - name: Test Uno
        run: dotnet test tests/ProCharts.Uno.Tests/ProCharts.Uno.Tests.csproj -c Release --no-build --logger "trx;LogFileName=procharts-uno-tests.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build docs
        run: ./build-docs.sh

  sample-builds:
    name: Sample Builds
    runs-on: ${{ matrix.os }}
    needs: [build-test, docs-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Avalonia Gallery
        run: dotnet build samples/ProCharts.Avalonia.Gallery/ProCharts.Avalonia.Gallery.csproj -c Release -p:ContinuousIntegrationBuild=true

      - name: Build Uno Gallery
        run: dotnet build samples/ProCharts.Uno.Gallery/ProCharts.Uno.Gallery/ProCharts.Uno.Gallery.csproj -c Release -p:ContinuousIntegrationBuild=true

  pack-packages:
    name: Pack Packages
    runs-on: macos-latest
    needs: [build-test, sample-builds]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack
        run: ./pack.sh 1.0.0-ci.${{ github.run_number }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 7
